      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollWrite'
      responses:
        '201':
          description: Poll created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
        '400':
          description: Validation failed or invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an organizer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List the polls of an event
      description: Anyone who can read the event sees its polls, how many times each option was chosen, and their own choices.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Polls of the event, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poll'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
