        '404':
          description: Unknown or hidden event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an event
      description: Reserved to the creator, or an admin or superadmin of the group. Deletes the event invitations too.
