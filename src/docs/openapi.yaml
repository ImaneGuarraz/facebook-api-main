      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: pollId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read a poll
      description: Anyone who can read the event sees the poll, how many times each option was chosen, and their own choices.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The poll
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden event, or poll that does not belong to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a poll
      description: An organizer deletes the poll and every answer.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Poll deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller is not an organizer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden event, or poll that does not belong to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
