openapi: 3.0.3
info:
  title: Facebook Events API
  version: 1.0.0
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, firstName, lastName]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
    GroupMember:
      type: object
      required: [user, role]
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum: [member, admin, superadmin]
    Group:
      type: object
      required:
        - id
        - name
        - description
        - icon
        - coverPhoto
        - visibility
        - membersCanPost
        - membersCanCreateEvents
        - role
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
          format: uri
          nullable: true
        coverPhoto:
          type: string
          format: uri
          nullable: true
        visibility:
          type: string
          enum: [public, private, secret]
        membersCanPost:
          type: boolean
        membersCanCreateEvents:
          type: boolean
        role:
          type: string
          nullable: true
          enum: [member, admin, superadmin]
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
    JoinRequest:
      type: object
      required: [id, group, user, createdAt]
      properties:
        id:
          type: string
        group:
          type: string
        user:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
    GroupInvitation:
      type: object
      required: [id, group, user, invitedBy, status]
      properties:
        id:
          type: string
        group:
          type: string
        user:
          $ref: '#/components/schemas/User'
        invitedBy:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [pending, accepted, declined]
    Event:
      type: object
      required:
        - id
        - name
        - description
        - startDate
        - endDate
        - location
        - coverPhoto
        - visibility
        - group
        - createdBy
        - organizers
        - participants
        - shoppingListEnabled
        - carpoolingEnabled
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: string
        coverPhoto:
          type: string
          format: uri
          nullable: true
        visibility:
          type: string
          enum: [public, private]
        group:
          type: string
          nullable: true
        createdBy:
          $ref: '#/components/schemas/User'
        organizers:
          type: array
          items:
            $ref: '#/components/schemas/User'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'
        shoppingListEnabled:
          type: boolean
        carpoolingEnabled:
          type: boolean
    EventWrite:
      type: object
      additionalProperties: false
      required: [name, startDate, endDate, location, visibility]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: string
          minLength: 1
          maxLength: 200
        coverPhoto:
          type: string
          format: uri
        visibility:
          type: string
          enum: [public, private]
        shoppingListEnabled:
          type: boolean
        carpoolingEnabled:
          type: boolean
    EventUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: string
          minLength: 1
          maxLength: 200
        coverPhoto:
          type: string
          format: uri
        visibility:
          type: string
          enum: [public, private]
        shoppingListEnabled:
          type: boolean
        carpoolingEnabled:
          type: boolean
    EventInvitation:
      type: object
      required: [id, event, user, invitedBy, status]
      properties:
        id:
          type: string
        event:
          type: string
        user:
          $ref: '#/components/schemas/User'
        invitedBy:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [pending, accepted, declined]
    PollOption:
      type: object
      required: [id, text, count]
      properties:
        id:
          type: string
        text:
          type: string
        count:
          type: integer
          minimum: 0
    PollQuestion:
      type: object
      required: [id, text, options]
      properties:
        id:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/PollOption'
    PollChoice:
      type: object
      required: [questionId, optionId]
      properties:
        questionId:
          type: string
        optionId:
          type: string
    Poll:
      type: object
      required: [id, event, createdBy, questions, myChoices]
      properties:
        id:
          type: string
        event:
          type: string
        createdBy:
          $ref: '#/components/schemas/User'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/PollQuestion'
        myChoices:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PollChoice'
    PollWrite:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [text, options]
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 300
              options:
                type: array
                minItems: 2
                maxItems: 12
                items:
                  type: string
                  minLength: 1
                  maxLength: 200
    PollAnswers:
      type: object
      additionalProperties: false
      required: [choices]
      properties:
        choices:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [questionId, optionId]
            properties:
              questionId:
                type: string
              optionId:
                type: string
    UserId:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
paths:
  /api/auth/register:
    post:
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/me:
    get:
      summary: Read the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update the signed-in user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups:
    post:
      summary: Create a group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, visibility]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                description:
                  type: string
                  maxLength: 2000
                icon:
                  type: string
                  format: uri
                coverPhoto:
                  type: string
                  format: uri
                visibility:
                  type: string
                  enum: [public, private, secret]
                membersCanPost:
                  type: boolean
                membersCanCreateEvents:
                  type: boolean
      responses:
        '201':
          description: Group created. The creator is the superadmin, so members are included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List visible groups
      description: Public and private groups, plus secret groups the caller belongs to. Each entry is a profile with the caller's role, without the member list.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read a group
      description: Members are included for a public group, and for a private or secret group when the caller is a member. A secret group hidden from the caller is a 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Group profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update a group
      description: Reserved to a superadmin of the group.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                description:
                  type: string
                  maxLength: 2000
                icon:
                  type: string
                  format: uri
                coverPhoto:
                  type: string
                  format: uri
                visibility:
                  type: string
                  enum: [public, private, secret]
                membersCanPost:
                  type: boolean
                membersCanCreateEvents:
                  type: boolean
      responses:
        '200':
          description: Updated group, including members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a group
      description: Reserved to a superadmin of the group.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Group deleted
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups/{id}/join:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Join a group or request to join
      description: A public group adds the caller as a member. A private group creates a join request. A secret group stays hidden and rejects the call with 404. A pending invitation on a private group must be accepted instead.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Membership created, or join request created for a private group
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Group'
                  - $ref: '#/components/schemas/JoinRequest'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown group, or secret group hidden from the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already a member, request already pending, or invitation already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups/{id}/join-requests:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List pending join requests
      description: An admin or a superadmin of the group.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JoinRequest'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups/{id}/join-requests/{userId}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Accept a join request
      description: An admin or a superadmin adds the user as a member.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated group, including members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown group, hidden group, or no pending request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User is already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups/{id}/join-requests/{userId}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Reject a join request
      description: An admin or a superadmin deletes the pending request. The user can request again.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Request rejected
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown group, hidden group, or no pending request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups/{id}/invitations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Invite a user to the group
      description: An admin or a superadmin. The invitee accepts or declines the invitation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInvitation'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or hidden group, or unknown user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already a member, invitation already pending, or request already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/groups/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Change a member role
      description: Reserved to a superadmin. Demoting the last superadmin is rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, admin, superadmin]
      responses:
        '200':
          description: Updated group, including members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown group, hidden group, or user is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The group would lose its last superadmin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove a member
      description: Reserved to a superadmin. Removing the last superadmin is rejected.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Member removed
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown group, hidden group, or user is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The group would lose its last superadmin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/group-invitations/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Accept an invitation
      description: The invitee becomes a member. Someone else's invitation is a 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Group the caller just joined, including members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown invitation, or invitation that is not pending for the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/group-invitations/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Decline an invitation
      description: The invitee declines. Someone else's invitation is a 404.
